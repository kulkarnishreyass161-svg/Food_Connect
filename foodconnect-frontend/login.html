
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | FoodConnect</title>
    <link rel="stylesheet" href="auth.css">
    <script src="auth.js" defer></script>
</head>
<body>

<main class="auth-layout">

    <!-- LEFT IMAGE SECTION -->
    <section class="auth-visual login-visual">

        <a href="index.html" class="auth-brand">
            <span class="brand-icon"><img src = "assets/Food_Connect_Logo.png"></span>
            FoodConnect
        </a>

        <div class="visual-content">

            <h1>Welcome back to the table.</h1>

            <p>
                Every login helps another meal find its way
                to someone who needs it.
            </p>

           

        </div>

    </section>


    <!-- RIGHT LOGIN FORM -->
    <section class="auth-panel">

        <div class="auth-content">

            <div class="auth-top">
                <a href="index.html" class="back-btn">←</a>

                <p>
                    New here?
                    <a href="register.html">Register</a>
                </p>
            </div>

            <div class="auth-heading">
                <h2>Sign in</h2>
                <p>Continue sharing and collecting food.</p>
            </div>


            <form id="loginForm">

                <div class="form-group">

                    <label for="loginEmail">Email address</label>

                    <input type="email" id="loginEmail"
                        name="email"
                        placeholder="✉  you@example.com"
                        autocomplete="email" required>

                </div>


                <div class="form-group">

                    <label for="loginPassword">Password</label>

                    <div class="password-wrapper">

                        <input type="password"
                            id="loginPassword"
                            name="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required>

                        <button type="button"
                            class="password-toggle"
                            data-target="loginPassword"
                            aria-label="Show password">👁</button>

                    </div>

                </div>


                <div class="login-options">

                    <label class="remember-option">
                        <input type="checkbox" name="remember">
                        Remember me
                    </label>

                    <a href="#" id="forgotPassword">
                        Forgot password?
                    </a>

                </div>


                <button type="submit" class="submit-btn">
                    Sign in →
                </button>

                <div class="divider">
                    <span>or continue with</span>
                </div>


                <div class="social-buttons">

                    <button type="button" class="social-btn"
                        id="googleLogin">
                         Google
                    </button>

                    <button type="button" class="social-btn"
                        id="phoneLogin">
                        Phone OTP
                    </button>

                </div>

                <p class="bottom-auth-text">
                    Don't have an account?
                    <a href="register.html">Register</a>
                </p>

            </form>

        </div>

    </section>

</main>

<div class="auth-toast" id="authToast"></div>

</body>
</html>
