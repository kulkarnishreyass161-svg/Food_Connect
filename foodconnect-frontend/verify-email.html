<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Verify Email | FoodConnect</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f4eb;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .verification-card {
            background: white;
            width: 100%;
            max-width: 450px;
            padding: 40px 30px;
            text-align: center;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.08);
        }

        .logo {
            color: #245c43;
            font-size: 30px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        h2 {
            color: #245c43;
            margin-bottom: 15px;
        }

        #status {
            color: #555;
            line-height: 1.6;
            margin: 20px 0;
        }

        .login-btn {
            display: inline-block;
            background: #245c43;
            color: white;
            padding: 13px 28px;
            text-decoration: none;
            border-radius: 7px;
            margin-top: 15px;
        }

        .login-btn:hover {
            background: #194530;
        }
    </style>
</head>

<body>

    <div class="verification-card">

        <div class="logo">FoodConnect</div>

        <h2>Email Verification</h2>

        <p id="status">Verifying your email address...</p>

        <a href="login.html" id="loginLink"
           class="login-btn" hidden>
            Go to Login
        </a>

    </div>

    <script src="verify-email.js"></script>

</body>
</html>
